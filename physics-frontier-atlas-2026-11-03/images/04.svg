/><rect x="90" y="525" width="6" height="130" rx="0" fill="#007e87" stroke="none"/><text x="110" y="561" font-size="26" fill="#172c42" font-weight="600" text-anchor="start">无中微子双β</text><text x="110" y="593" font-size="21" fill="#53687a" font-weight="400" text-anchor="start">建立竞争理论描述。</text><text x="422" y="640" font-size="16" fill="#007e87" font-weight="400" text-anchor="end">研究中</text><rect x="560" y="525" width="355" height="130" rx="14" fill="#fff" stroke="#cfdae4"/><rect x="560" y="525" width="6" height="130" rx="0" fill="#007e87" stroke="none"/><text x="580" y="561" font-size="26" fill="#172c42" font-weight="600" text-anchor="start">轻子CP相</text><text x="580" y="593" font-size="21" fill="#53687a" font-weight="400" text-anchor="start">寻找区分性观测信号。</text><text x="892" y="640" font-size="16" fill="#007e87" font-weight="400" text-anchor="end">研究中</text><rect x="1030" y="525" width="355" height="130" rx="14" fill="#fff" stroke="#cfdae4"/><rect x="1030" y="525" width="6" height="130" rx="0" fill="#007e87" stroke="none"/><text x="1050" y="561" font-size="26" fill="#172c42" font-weight="600" text-anchor="start">重子生成</text><text x="1050" y="593" font-size="21" fill="#53687a" font-weight="400" text-anchor="start">估计误差与适用范围。</text><text x="1362" y="640" font-size="16" fill="#007e87" font-weight="400" text-anchor="end">研究中</text><text x="85" y="696" font-size="20" fill="#53687a" font-weight="400" text-anchor="start">实线：理论/方法关系　虚线：候选解释或待证联系；均须结合节点条件阅读。</text><rect x="1540" y="210" width="800" height="525" rx="18" fill="#e5edf5" stroke="none"/><text x="1570" y="255" font-size="28" fill="#007e87" font-weight="600" text-anchor="start">关键方程 · 适用条件</text><text x="1570" y="308" font-size="32" fill="#172c42" font-weight="500" text-anchor="start">P(να→νβ)=|Σᵢ Uβi e⁻ⁱEᵢL U*αi|²</text><text x="1570" y="350" font-size="23" fill="#53687a" font-weight="400" text-anchor="start">中微子振荡表明质量态与味态不同；质量排序与CP相仍是研究焦点。</text><text x="1570" y="445" font-size="32" fill="#172c42" font-weight="500" text-anchor="start">观测 O ↔ 参数 θ</text><text x="1570" y="487" font-size="23" fill="#53687a" font-weight="400" text-anchor="start">通过似然、系统误差模型与独立数据进行比较。</text><text x="1570" y="582" font-size="32" fill="#172c42" font-weight="500" text-anchor="start">模型 M: 𝒫(data | θ, M)</text><text x="1570" y="624" font-size="23" fill="#53687a" font-weight="400" text-anchor="start">结论依赖先验、近似、尺度与边界条件。</text><rect x="60" y="775" width="740" height="320" rx="14" fill="white" stroke="#d6e1e9"/><rect x="60" y="775" width="740" height="6" rx="0" fill="#007e87" stroke="none"/><text x="84" y="818" font-size="29" fill="#172c42" font-weight="600" text-anchor="start">PMNS参数</text><text x="770" y="816" font-size="19" fill="#007e87" font-weight="500" text-anchor="end">框架</text><text x="83" y="863" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="109" y="863" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">中微子振荡表明质量态与味态不同；质量排序与CP相仍是研究焦点。</text><text x="83" y="897" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="109" y="897" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">PMNS参数：中微子振荡表明质量态与味态不同；质量排序与CP相仍是</text><text x="109" y="926" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">研究焦点。</text><text x="83" y="960" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="109" y="960" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">判别问题：哪些测量或推导能区分PMNS参数下的竞争机制？需检验参数</text><text x="109" y="989" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">退化、近似边界与可重复性。</text><text x="84" y="1078" font-size="17" fill="#53687a" font-weight="400" text-anchor="start">依据 [JUNO] [PDG26]</text><rect x="830" y="775" width="740" height="320" rx="14" fill="white" stroke="#d6e1e9"/><rect x="830" y="775" width="740" height="6" rx="0" fill="#007e87" stroke="none"/><text x="854" y="818" font-size="29" fill="#172c42" font-weight="600" text-anchor="start">质量排序</text><text x="1540" y="816" font-size="19" fill="#007e87" font-weight="500" text-anchor="end">证据</text><text x="853" y="863" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="879" y="863" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">JUNO 2026给出正常排序至少2.1σ指示，不等于确定；轻子生成重子不</text><text x="879" y="892" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">对称仍属模型机制。</text><text x="853" y="926" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="879" y="926" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">关键约束：JUNO 2026给出正常排序至少2.1σ指示，不等于确定；轻子</text><text x="879" y="955" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">生成重子不对称仍属模型机制。</text><text x="853" y="989" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="879" y="989" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">判别问题：哪些测量或推导能区分质量排序下的竞争机制？需检验参数</text><text x="879" y="1018" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">退化、近似边界与可重复性。</text><text x="854" y="1078" font-size="17" fill="#53687a" font-weight="400" text-anchor="start">依据 [JUNO] [PDG26]</text><rect x="1600" y="775" width="740" height="320" rx="14" fill="white" stroke="#d6e1e9"/><rect x="1600" y="775" width="740" height="6" rx="0" fill="#007e87" stroke="none"/><text x="1624" y="818" font-size="29" fill="#172c42" font-weight="600" text-anchor="start">Dirac/Majorana</text><text x="2310" y="816" font-size="19" fill="#007e87" font-weight="500" text-anchor="end">方法</text><text x="1623" y="863" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="1649" y="863" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">成熟工具提供可控计算与检验。</text><text x="1623" y="897" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="1649" y="897" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">研究操作：围绕“Dirac/Majorana”构造可计算量或观测量，与独立数</text><text x="1649" y="926" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">据比较；报告模型假设、系统误差和适用能标。</text><text x="1623" y="960" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="1649" y="960" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">判别问题：哪些测量或推导能区分Dirac/Majorana下的竞争机制？需检</text><text x="1649" y="989" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">验参数退化、近似边界与可重复性。</text><text x="1624" y="1078" font-size="17" fill="#53687a" font-weight="400" text-anchor="start">依据 [JUNO] [PDG26]</text><rect x="60" y="1125" width="740" height="320" rx="14" fill="white" stroke="#d6e1e9"/><rect x="60" y="1125" width="740" height="6" rx="0" fill="#007e87" stroke="none"/><text x="84" y="1168" font-size="29" fill="#172c42" font-weight="600" text-anchor="start">无中微子双β</text><text x="770" y="1166" font-size="19" fill="#007e87" font-weight="500" text-anchor="end">比较</text><text x="83" y="1213" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="109" y="1213" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">竞争模型须给出不同的可测预言。</text><text x="83" y="1247" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="109" y="1247" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">无中微子双β：中微子振荡表明质量态与味态不同；质量排序与CP相仍</text><text x="109" y="1276" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">是研究焦点。</text><text x="83" y="1310" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="109" y="1310" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">判别问题：哪些测量或推导能区分无中微子双β下的竞争机制？需检验参</text><text x="109" y="1339" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">数退化、近似边界与可重复性。</text><text x="84" y="1428" font-size="17" fill="#53687a" font-weight="400" text-anchor="start">依据 [JUNO] [PDG26]</text><rect x="830" y="1125" width="740" height="320" rx="14" fill="white" stroke="#d6e1e9"/><rect x="830" y="1125" width="740" height="6" rx="0" fill="#007e87" stroke="none"/><text x="854" y="1168" font-size="29" fill="#172c42" font-weight="600" text-anchor="start">轻子CP相</text><text x="1540" y="1166" font-size="19" fill="#007e87" font-weight="500" text-anchor="end">限制</text><text x="853" y="1213" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="879" y="1213" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">跨尺度外推要注明假设与误差。</text><text x="853" y="1247" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="879" y="1247" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">关键约束：JUNO 2026给出正常排序至少2.1σ指示，不等于确定；轻子</text><text x="879" y="1276" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">生成重子不对称仍属模型机制。</text><text x="853" y="1310" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="879" y="1310" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">判别问题：哪些测量或推导能区分轻子CP相下的竞争机制？需检验参数</text><text x="879" y="1339" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">退化、近似边界与可重复性。</text><text x="854" y="1428" font-size="17" fill="#53687a" font-weight="400" text-anchor="start">依据 [JUNO] [PDG26]</text><rect x="1600" y="1125" width="740" height="320" rx="14" fill="white" stroke="#d6e1e9"/><rect x="1600" y="1125" width="740" height="6" rx="0" fill="#007e87" stroke="none"/><text x="1624" y="1168" font-size="29" fill="#172c42" font-weight="600" text-anchor="start">重子生成</text><text x="2310" y="1166" font-size="19" fill="#007e87" font-weight="500" text-anchor="end">前沿</text><text x="1623" y="1213" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="1649" y="1213" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">开放问题需要新数据或新方法。</text><text x="1623" y="1247" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="1649" y="1247" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">研究操作：围绕“重子生成”构造可计算量或观测量，与独立数据比较</text><text x="1649" y="1276" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">；报告模型假设、系统误差和适用能标。</text><text x="1623" y="1310" font-size="25" fill="#007e87" font-weight="400" text-anchor="start">•</text><text x="1649" y="1310" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">判别问题：哪些测量或推导能区分重子生成下的竞争机制？需检验参数</text><text x="1649" y="1339" font-size="21" fill="#172c42" font-weight="400" text-anchor="start">退化、近似边界与可重复性。</text><text x="1624" y="1428" font-size="17" fill="#53687a" font-weight="400" text-anchor="start">依据 [JUNO] [PDG26]</text><rect x="60" y="1498" width="2280" height="94" rx="12" fill="#dfeef0" stroke="none"/><text x="84" y="1533" font-size="24" fill="#007e87" font-weight="600" text-anchor="start">关键辨析</text><text x="245" y="1533" font-size="24" fill="#172c42" font-weight="400" text-anchor="start">JUNO 2026给出正常排序至少2.1σ指示，不等于确定；轻子生成重子不对称仍属模型机制。</text><text x="60" y="1630" font-size="23" fill="#007e87" font-weight="500" text-anchor="start">跨图路径  见总索引：3, 5</text><a href="https://arxiv.org/abs/2609.37895"><text x="60" y="1670" font-size="18" fill="#53687a" font-weight="400" text-anchor="start">[JUNO] JUNO Collaboration, 2026 oscillation results</text></a><a href="https://pdg.lbl.gov/2026/reviews/contents_sports.html"><text x="1210" y="1670" font-size="18" fill="#53687a" font-weight="400" text-anchor="start">[PDG26] Particle Data Group, Review of Particle Physics 2026</text></a><text x="60" y="1780" font-size="18" fill="#53687a" font-weight="400" text-anchor="start">资料核对：2026-11-03　|　关系图为依据文献重绘；非穷尽目录；详细链接与限定见来源索引。</text></g></svg>